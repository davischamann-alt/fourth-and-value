# Sundays from noon to 11 p.m. Eastern, every 30 minutes: next week's lines open then and move
# within hours, and a pick is only worth as much as the number it was logged at. This is the light
# half of site.yml: it records lines and picks, checks the sportsbooks, sends alerts and commits.
# It doesn't rebuild the backtest, props or forecasts, or publish the site; the two-hourly job in
# site.yml does that and picks up whatever this one committed. Fewer steps means it finishes in
# about a minute and has fewer ways to fail when ESPN hiccups.
name: Record lines (Sundays)

on:
  schedule:
    - cron: "7,37 17-23 * * 0"
    - cron: "7,37 0-3 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # to commit the pick log

# the same group as site.yml, so the two never commit at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the same daily CollegeFootballData cache as site.yml, so this adds no calls on a day that
      # job has already run
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/cfbd
          key: cfbd-v2-${{ steps.day.outputs.day }}
          restore-keys: cfbd-v2-
      - name: Record lines and picks
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python record.py
      - name: Line shopping
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds.py
      # QB change notes come from the last full run's qb.json when it's there; alerts work without it
      - name: Send alerts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alerts.py
      - name: Commit the pick log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -z "$(git status --porcelain -- data/live)" ] && exit 0
          git add data/live site/data/live.json site/data/game_log.json
          git add site/data/alerts.json site/alerts.xml 2>/dev/null || true
          git commit -q -m "Record lines and picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
