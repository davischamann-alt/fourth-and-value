# Every two hours: records lines and the model's picks before kickoff (the forward test) and
# commits them, so git history proves when each pick was made; then rebuilds the website's data
# (ratings, model settings, track record) and publishes the site to GitHub Pages. Also runs when
# site code or data/qb_status.csv (quarterbacks on the availability reports) changes on main, and
# on demand from the Actions tab ("Run workflow").
name: Update and publish site

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours, at 17 minutes past (GitHub is busiest on the hour)
    # Sundays from noon to 11 p.m. Eastern, every 30 minutes: next week's lines open then and move
    # within hours, and a pick is only worth as much as the number it was logged at
    - cron: "7,37 17-23 * * 0"
    - cron: "7,37 0-3 * * 1"
  push:
    branches: [main]
    paths: ["site/**", "build_site.py", "build_props.py", "record.py", "alerts.py", "weather.py", "odds.py", "sources.py", "model.py", "data/qb_status.csv", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to commit the pick log
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # CollegeFootballData downloads: past seasons never change, and this season's efficiency data
      # is refreshed once a day. A new cache each day keeps that to one download a day (the free
      # plan allows 1,000 calls a month).
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/cfbd
          key: cfbd-v2-${{ steps.day.outputs.day }}
          restore-keys: cfbd-v2-
      # Recorded first, so a problem in the steps after it can't lose a pick
      - name: Record lines and picks
        env:
          # for the Efficiency ratings behind the Efficiency and Blend picks
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python record.py
      # ESPN box scores for player props and the QB watch: finished games never change, so keep
      # them between runs
      - uses: actions/cache@v6
        with:
          path: data/box
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      # Best available spread and total across sportsbooks (The Odds API, 500 free credits a month;
      # odds.py rations its own calls). Before the commit step, which saves what it fetched.
      - name: Line shopping
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds.py
      - name: Build player props, QB watch and QB availability
        # a hiccup at ESPN shouldn't stop the rest of the site from publishing; the last props stay up
        continue-on-error: true
        run: python build_props.py
      # New edges and key-number line moves: always to the site's feed; to phones and Discord
      # when those are set up (see "Alerts" in the README). A failed send shouldn't stop the run.
      - name: Send alerts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alerts.py
      - name: Commit the pick log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only when the line history or a pick log changed (or a new log file appeared);
          # on its own, live.json just has a new timestamp
          [ -z "$(git status --porcelain -- data/live)" ] && exit 0
          git add data/live site/data/live.json site/data/game_log.json
          git add site/data/alerts.json site/alerts.xml 2>/dev/null || true
          git commit -q -m "Record lines and picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Build site data
        env:
          # Optional: add a CFBD_API_KEY repository secret to include past seasons in the track record
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_site.py
      - name: Kickoff weather
        # stadium locations from CollegeFootballData, forecasts from Open-Meteo; optional
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python weather.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
