# Every two hours: records lines and the model's picks before kickoff (the forward test) and
# commits them, so git history proves when each pick was made; then rebuilds the website's data
# (ratings, model settings, track record) and publishes the site to GitHub Pages. Also runs when
# site code changes on main, and on demand from the Actions tab ("Run workflow").
name: Update and publish site

on:
  schedule:
    - cron: "17 */2 * * *"   # every two hours, at 17 minutes past (GitHub is busiest on the hour)
  push:
    branches: [main]
    paths: ["site/**", "build_site.py", "build_props.py", "record.py", "sources.py", "model.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to commit the pick log
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Past seasons from CollegeFootballData never change, so keep them between runs
      - uses: actions/cache@v6
        with:
          path: data/cfbd
          key: cfbd-v1
      # Recorded first, so a problem in the steps after it can't lose a pick
      - name: Record lines and picks
        run: python record.py
      - name: Commit the pick log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit only when the line history or a pick log changed (or a new log file appeared);
          # on its own, live.json just has a new timestamp
          [ -z "$(git status --porcelain -- data/live)" ] && exit 0
          git add data/live site/data/live.json site/data/game_log.json
          git commit -q -m "Record lines and picks $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Build site data
        env:
          # Optional: add a CFBD_API_KEY repository secret to include past seasons in the track record
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_site.py
      # ESPN box scores for player props: finished games never change, so keep them between runs
      - uses: actions/cache@v6
        with:
          path: data/box
          key: espn-box-${{ github.run_id }}
          restore-keys: espn-box-
      - name: Build player props
        # a hiccup at ESPN shouldn't stop the rest of the site from publishing; the last props stay up
        continue-on-error: true
        run: python build_props.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
