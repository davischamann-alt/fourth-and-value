name: Suggestion
description: Ideas for new features, better picks, or a clearer site
title: "Suggestion: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Fourth & Value. Suggestions are public, so please don't include personal information.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Picks and the model
        - Game details
        - Games board
        - Ratings
        - My picks or Bets
        - Track record
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Your suggestion
      description: What would you like to see, and why would it help?
    validations:
      required: true
